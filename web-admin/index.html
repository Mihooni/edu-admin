<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="星课 StarClass · 教培 / 健身机构一体化教务与会员管理系统" />
    <title>星课 · 机构管理后台</title>
    <script>
      // 主题无闪烁引导：在首帧绘制前按持久化偏好挂好 data-theme / dark / color-scheme，
      // 避免暗色系统下先闪白（与 src/utils/theme.js 的取值逻辑保持一致）
      (function () {
        try {
          var m = localStorage.getItem('edu_theme')
          if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system'
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          el.setAttribute('data-theme', dark ? 'dark' : 'light')
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* 无 localStorage 时保持默认亮色 */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
